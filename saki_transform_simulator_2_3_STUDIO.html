const DEFAULT={relation:'指定なし',relationPerson:'',innerMood:'自然な落ち着き',sceneTime:'指定場所に自然な時間帯',sceneNotes:'',mode:'manual',tab:'outfit',outputMode:'scene',bg:'淡いグレーの無地壁',personPose:'直立して両腕を自然に下ろす。',topVolume:2,curlLevel:2,bangs:'自然な前髪',eyelashShape:'目尻がやや長い束感',framing:'全身・靴まで',angle:'左斜め45度',gaze:'カメラ目線なし、自然に横を見る',shoeNeed:'見せる',tattooNeed:'衣装から自然に見える範囲のみ',lighting:'柔らかい室内の実在光',stage:'month1',variant:1,style:'real',boost:0,filter:'',outfitType:'suit',outfitGroup:'black',outfit:'05',fit:'身体に沿う自然なタイトシルエット',hem:'衣装の標準丈',glam:2,outfitNote:'',hairView:'club',hair:'S04',color:'C13',bright:9,yellow:9,roots:'染めたて・根元まで均一',highlights:'なし',texture:'少し乾燥した毛先',makeup:'M04',m:[9,8,9,9,9,8,5],shadowColor:'ブルーグレー',lipColor:'濃いローズレッド',tattoo:'T03',jewelry:'A02',shoes:'SH06',nails:'N07',accView:'tattoo',group:'cafe',scene:'floor-0',phase:'1か月',place:'宮城県仙台市国分町のキャバクラ店内フロア',action:'接客中、椅子に腰かけて相手の話を聞く。',camera:'客席から斜め45度、約2m先のiPhone写真',expression:'自然な表情・カメラ目線なし',extra:'',refType:'face'};
let s={...DEFAULT};try{let raw=JSON.parse(localStorage.getItem('saki_studio_23_state')||'null');if(raw&&typeof raw==='object')s={...s,...raw};}catch(e){}
let referenceImages={};const $=sel=>document.querySelector(sel), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('saki_studio_23_state',JSON.stringify(s))}catch(e){}}
function findScene(id){for(const g of SCENES){let r=g.items.find(x=>x.id===id);if(r)return r;}return SCENES[0].items[0]}
function setScene(id){const r=findScene(id);s.scene=r.id;s.group=r.group;s.place=r.place;s.action=r.action;s.camera=r.camera;}
function stageApply(id,variant=0){const t=STAGES.find(x=>x.id===id)||STAGES[6];s.mode='auto';s.stage=id;s.phase=t.name;s.variant=variant;s.color=t.color;s.hair=(variant===1?t.club:t.daily);s.hairView=variant===1?'club':'daily';s.outfit=(variant===1?t.suit:variant===2?t.dress:t.casual);s.outfitType=O[s.outfit]?.type||'casual';s.outfitGroup=O[s.outfit]?.group||'day';s.makeup=t.makeup;s.topVolume=t.id==='year'?4:t.id==='half'?2:t.id==='before'?0:2;s.curlLevel=t.id==='year'?4:t.id==='half'?2:2;s.m=[...makeupPresets.find(x=>x[0]===t.makeup)[2]];s.tattoo=t.tattoo;s.jewelry=t.jewelry;s.nails=t.nails;s.shoes=t.shoes;s.boost=0;s.style='real';const sc=t.scenes[variant];setScene(sc);s.glam=Math.min(5,Math.ceil(STAGES.indexOf(t)/3));s.expression=variant===0?'カメラ目線なし、自然な日常の表情':variant===1?'接客中の自然な表情': '営業後の落ち着いた表情';save();render();}
function field(k,value){s[k]=value;save();}
function setTab(t){s.tab=t;if(t==='person')s.outputMode='person';if(t==='scene')s.outputMode='scene';save();render();window.scrollTo(0,0)}
function setMode(mode){s.mode=mode;setTab(mode==='auto'?'auto':'person')}
function button(label,fn,cls='chip',selected=false){return `<button type="button" class="${cls}${selected?' active':''}" onclick="${fn}">${esc(label)}</button>`}
function slider(label,key,min=0,max=10,step=1){return `<div class="control"><div class="row between"><label>${label}</label><b class="num" id="nv-${key}">${s[key]}</b></div><input type="range" min="${min}" max="${max}" step="${step}" value="${s[key]}" oninput="updateRange('${key}',this.value)"></div>`}
function mSlider(label,index){return `<div class="control"><div class="row between"><label>${label}</label><b class="num" id="mv-${index}">${s.m[index]}</b></div><input type="range" min="0" max="10" step="1" value="${s.m[index]}" oninput="updateM(${index},this.value)"></div>`}
function sel(label,key,choices){return `<div class="control"><label>${label}</label><select onchange="change('${key}',this.value)">${choices.map(x=>{const v=Array.isArray(x)?x[0]:x,t=Array.isArray(x)?x[1]:x;return `<option value="${esc(v)}" ${s[key]===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function txt(label,key,rows=2){return `<div class="control"><label>${label}</label><textarea rows="${rows}" oninput="field('${key}',this.value)">${esc(s[key])}</textarea></div>`}
function pick(key,id){s.mode='manual';s[key]=id;if(key==='outfit'){s.outfitType=O[id].type;s.outfitGroup=O[id].group}if(key==='hair')s.hairView=H[id].group;save();render()}
function colorFor(id){return COLORS.find(x=>x[0]===id)?.[2]||'#cfab57'}
function svgAvatar(opts={}){let kind=opts.kind||'outfit',name=opts.name||'',id=opts.id||'',isDress=/ドレス|ワンピ|マーメイド/.test(name)||id[0]==='D',isSkirt=/スカート|ミニ|ミディ|タイト|ドレス|ワンピ|ペンシル/.test(name)||isDress,isWhite=/白|アイボリー/.test(name),isRed=/赤|深紅|ボルドー|ワイン/.test(name),isPurple=/紫/.test(name),hasPrint=/花柄|薔薇|レオパード|チェーン|パイソン|ゼブラ/.test(name),base=kind==='hair'?colorFor(s.color):kind==='color'?opts.color||'#ba8146':kind==='makeup'?'#4e3227':'#9d704c',jacket=isWhite?'#e6d9ce':isRed?'#8c2940':isPurple?'#59365d':/黒/.test(name)?'#24252a':'#786d80',lower=isWhite?'#efdfd2':/白.*スカート/.test(name)?'#e2d6cb':isRed?'#823044':/黒/.test(name)?'#1c2028':'#74617a';if(kind==='makeup')base='#543129';let variant=(id.charCodeAt(0)||1)%3;
let skin='#d1a38d';let make=kind==='makeup'?Math.max(2,opts.level||8):6;
let decorated=hasPrint?`<path d="M48 164q14-13 24 4m20 16q18-11 32 5m-73 29q18-9 28 4" fill="none" stroke="${/花|薔薇/.test(name)?'#c66a77':'#d8b36d'}" stroke-width="3" opacity=".8"/>`:'';
let upper=`<path d="M57 131 L103 131 Q127 144 133 171 L122 225 H37 L27 170 Q29 145 57 131Z" fill="${jacket}"/><path d="M64 136L80 165L95 136" fill="none" stroke="${isWhite?'#535057':'#eee1da'}" stroke-width="2" opacity=".8"/>`;
let bottom=isDress?`<path d="M50 192L111 192L131 315Q80 324 28 315Z" fill="${jacket}"/>`:isSkirt?`<path d="M46 211L117 211L128 273L34 273Z" fill="${lower}"/>`:`<path d="M45 210L116 210L113 324H87L79 241L72 324H47Z" fill="${lower}"/>`;
if(kind==='hair'||kind==='color'||kind==='makeup') {upper=`<path d="M45 145Q80 126 115 145L144 250H16Z" fill="#31313c"/>`;bottom='';}
let hairSil=kind==='hair'&&/アップ|ポニー/.test(name)?`<ellipse cx="82" cy="61" rx="40" ry="50" fill="${base}"/><ellipse cx="81" cy="32" rx="28" ry="21" fill="${base}"/>`:`<path d="M38 102Q20 50 46 24Q80 -7 115 25Q139 54 125 118L132 182Q110 169 105 128L49 127Q40 159 26 183Z" fill="${base}"/>`;
const svg=`<svg viewBox="0 0 160 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="衣装・髪型の参考イメージ"><defs><linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67505f"/><stop offset="1" stop-color="#282830"/></linearGradient><linearGradient id="sk${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1cbb4"/><stop offset="1" stop-color="#ac796c"/></linearGradient><filter id="blur${id}"><feGaussianBlur stdDeviation=".9"/></filter></defs><rect width="160" height="340" fill="url(#bg${id})"/><path d="M18 0V340 M144 0V340" stroke="#faf0e1" stroke-opacity=".06" stroke-width="12"/><ellipse cx="80" cy="337" rx="73" ry="8" fill="#09090a" opacity=".3"/>
<path d="M61 253L68 327H82L81 253M84 253L99 327H112L111 249" fill="url(#sk${id})"/>${bottom}<path d="M45 151L29 226Q23 241 28 245L34 247L55 183M116 151L132 229Q138 244 130 247L124 245L105 183" fill="${skin}"/>${upper}${decorated}
${hairSil}<rect x="71" y="110" width="20" height="34" rx="7" fill="url(#sk${id})"/><ellipse cx="80" cy="79" rx="36" ry="47" fill="url(#sk${id})"/><path d="M43 67Q40 28 66 21Q102 13 119 50L116 70Q93 51 69 55L49 79Z" fill="${base}"/>
<path d="M55 89Q65 82 72 89M88 89Q99 82 108 88" stroke="#3c2726" stroke-width="2" fill="none"/><path d="M58 91Q66 94 74 91M87 91Q98 94 105 90" stroke="${make>7?'#151319':'#55413c'}" stroke-width="${make>7?3:1.8}" fill="none"/><circle cx="67" cy="91" r="1.8" fill="#2a2120"/><circle cx="98" cy="91" r="1.8" fill="#2a2120"/><path d="M80 93L77 108Q80 110 84 108" stroke="#aa7168" fill="none" stroke-width="1.5"/><path d="M70 118Q81 121 92 117" stroke="${kind==='makeup'&&make>5?'#a82f50':'#905a62'}" stroke-width="${make>7?3:2}" fill="none"/>
<path d="M42 54Q39 107 51 142L34 176" stroke="${base}" stroke-width="14" fill="none" opacity=".94"/><path d="M114 57Q123 113 112 145L129 176" stroke="${base}" stroke-width="14" fill="none" opacity=".94"/>`+`</svg>`;return svg;}
const photoCache={};let photoDB=null;
try{const request=indexedDB.open('saki_photo_catalog_v2',1);request.onupgradeneeded=()=>request.result.createObjectStore('photos');request.onsuccess=()=>{photoDB=request.result;loadAllPhotos()}}catch(e){}
function loadAllPhotos(){if(!photoDB)return;const tx=photoDB.transaction('photos','readonly');const req=tx.objectStore('photos').getAllKeys();req.onsuccess=()=>{for(const key of req.result){const r=tx.objectStore('photos').get(key);r.onsuccess=()=>{photoCache[key]=r.result;refreshPhoto(key)}}}}
function refreshPhoto(key){document.querySelectorAll('[data-photo-key]').forEach(el=>{if(el.dataset.photoKey===key){el.innerHTML=photoCache[key]?`<img src="${photoCache[key]}" alt="登録した日本人モデルの参照写真" loading="lazy">`:photoPlaceholder();}})}
function photoPlaceholder(){return '<div class="photo-empty"><span>📷</span><small>写真未登録</small></div>'}
function tile(obj,handler,selected,kind='outfit',extra=''){const key=kind+':'+obj.id;const own=photoCache[key];const sample=sampleImage[key];const url=own||(sample&&sample.url);const photo=url?`<img src="${esc(url)}" alt="参考写真" loading="lazy" onerror="this.parentNode.innerHTML=photoPlaceholder()">`:photoPlaceholder();return `<div class="catalog-card ${selected?'selected':''}"><button type="button" class="tile" onclick="${handler}" aria-label="${esc(obj.id+' '+obj.name)}"><div class="thumb photo-thumb" data-photo-key="${esc(key)}">${photo}${sample&&!own?'<span class="photo-credit">AI写真風見本</span>':''}</div><span class="name"><span class="code">${esc(obj.id)}</span>${esc(obj.name)}</span>${selected?'<span class="check">✓ 選択</span>':''}${extra?`<span class="desc">${esc(extra)}</span>`:''}</button><div class="photo-actions"><button type="button" onclick="zoomCatalogPhoto('${esc(key)}')">🔍 写真を拡大</button><button type="button" onclick="removeCatalogPhoto('${esc(key)}')">↩ 写真を戻す</button></div><label class="photo-upload">📷 好みの写真に差し替え<input type="file" accept="image/*" onchange="storeCatalogPhoto('${esc(key)}',this.files[0])"></label></div>`}
window.storeCatalogPhoto=(key,file)=>{if(!file)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const max=650,ratio=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*ratio);cv.height=Math.round(im.height*ratio);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const data=cv.toDataURL('image/jpeg',.75);photoCache[key]=data;refreshPhoto(key);if(photoDB){const tx=photoDB.transaction('photos','readwrite');tx.objectStore('photos').put(data,key)}toast('写真を登録しました ✓')};im.src=reader.result};reader.readAsDataURL(file)};

function panelAuto(){const st=STAGES.find(x=>x.id===s.stage)||STAGES[6];return `<section class="section"><h2>⚡ オート｜12段階 × 3固定パターン</h2><p class="hint">登録した衣装・髪・メイク・刺青・場所を読み込みます。物語の印象で勝手に派手さを増減しません。選択後は自由に手動修正できます。</p><div class="stages">${STAGES.map(x=>`<button class="stg ${s.stage===x.id?'active':''}" onclick="stageApply('${x.id}')">${esc(x.name)}</button>`).join('')}</div><div class="line"></div><h3>明示的な3種類のパターン</h3><div class="chips">${['日常・私服','勤務・スーツ','勤務・ドレス'].map((x,i)=>button(x,`stageApply('${s.stage}',${i})`,'chip',s.variant===i)).join('')}</div><div class="launch">オートは設定値を読み込むだけ。人物検証の出力では場所・物語設定は一切送信しません。</div>${summary()}<button class="primary" onclick="setTab('person')">👤 人物検証でプロンプトを作る</button><div style="height:8px"></div><button class="secondary" style="width:100%" onclick="setTab('scene')">📍 場面ありで作る</button></section>`}
function summary(){const hair=H[s.hair]?.name||'',co=COLORS.find(x=>x[0]===s.color),o=O[s.outfit],ta=ADDONS.tattoo.find(x=>x[0]===s.tattoo),sc=SCENES.flatMap(x=>x.items).find(x=>x.id===s.scene);return `<div class="previewline"><span class="k">変貌段階</span><span class="v">${esc(s.phase)}</span></div><div class="previewline"><span class="k">ヘア</span><span class="v">${esc(hair)}<br><span class="small">${esc(co?.[1])}・黄み ${s.yellow}/10</span></span></div><div class="previewline"><span class="k">メイク</span><span class="v">${esc(makeupPresets.find(x=>x[0]===s.makeup)?.[1]||'手動調整')}<br><span class="small">ファンデ ${s.m[0]}/10　白さ ${s.m[1]}/10　アイ ${s.m[2]}/10　まつ毛 ${s.m[4]}/10</span></span></div><div class="previewline"><span class="k">衣装</span><span class="v">${esc(o?.id)} ${esc(o?.name)}</span></div><div class="previewline"><span class="k">装飾</span><span class="v">${esc(ta?.[1])}<br><span class="small">${esc(ADDONS.jewelry.find(x=>x[0]===s.jewelry)?.[1])}・${esc(ADDONS.shoes.find(x=>x[0]===s.shoes)?.[1])}</span></span></div><div class="previewline"><span class="k">場面</span><span class="v">${esc(sc?.name||'自由入力')}<br><span class="small">${esc(s.place)}</span></span></div>`}
function panelOutfit(){let grp=Object.values(O).filter(x=>x.group===s.outfitGroup);const groups=s.outfitType==='casual'?[['day','昼・普段'],['night','出勤・帰宅'],['elegant','大人きれいめ'],['glam','華やか'],['relax','ラフ'],['outer','アウター']]:s.outfitType==='suit'?[['black','黒 ①〜⑩'],['white','白 ⑪〜⑮'],['colored','色物 ⑯〜㉖']]:[['plain','無地・サテン'],['pattern','柄・レース']];if(!groups.some(x=>x[0]===s.outfitGroup))grp=Object.values(O).filter(x=>x.group===groups[0][0]);return `<section class="section"><h2>👗 衣装82種類</h2><div class="chips">${[['casual','私服40'],['suit','キャバ嬢スーツ26'],['dress','ドレス16']].map(x=>button(x[1],`changeOutType('${x[0]}')`,'chip',s.outfitType===x[0])).join('')}</div><div class="chips">${groups.map(x=>button(x[1],`groupOut('${x[0]}')`,'chip',s.outfitGroup===x[0])).join('')}</div><p class="hint">写真をタップして衣装を選択。18種類のAI生成・写真風サンプルを内蔵。その他は写真を登録できます。🔍で拡大、📷で差し替え。衣装見本の人物の顔は早紀本人の参照に使いません。</p><div class="grid">${grp.map(x=>tile(x,`pick('outfit','${x.id}')`,s.outfit===x.id,'outfit')).join('')}</div><div class="line"></div><h3>衣装の細部調整</h3>${sel('フィット感','fit',['自然なレギュラーフィット','身体に沿う自然なタイトシルエット','かなり細身のフィット感','ゆったりしたシルエット'])}${sel('スカート・ワンピースの丈','hem',['衣装の標準丈','マイクロミニ丈','膝上ミニ丈','膝丈','膝下ミディ丈','ふくらはぎ丈','ロング丈','パンツは変更なし'])}${slider('華やかさ','glam',0,5)}${txt('衣装への自由指定','outfitNote')}</section>`}
function panelHair(){let isColor=s.hairView==='color',ls=Object.values(H).filter(x=>x.group===s.hairView);return `<section class="section"><h2>✂️ ヘアスタイル・髪色</h2><div class="chips">${[['daily','日常ヘア'],['club','店のヘアセット'],['color','髪色16段階']].map(x=>button(x[1],`setHairView('${x[0]}')`,'chip',s.hairView===x[0])).join('')}</div>${isColor?`<div class="grid">${COLORS.map(x=>tile({id:x[0],name:x[1],hex:x[2]},`pick('color','${x[0]}')`,s.color===x[0],'color')).join('')}</div>`:`<p class="hint">${s.hairView==='daily'?'日常の自然な髪型':'国分町の店用ヘアセット'}を別々に選択します。</p><div class="grid">${ls.map(x=>tile(x,`pick('hair','${x.id}')`,s.hair===x.id,'hair')).join('')}</div>`}<div class="line"></div><h3>髪型を固定する詳細数値</h3>${slider('トップの盛り具合','topVolume',0,5)}${slider('毛先・巻きの強さ','curlLevel',0,5)}${sel('前髪の形','bangs',['自然な前髪','薄い前髪','厚めの前髪','斜め流し','かき上げ','前髪なし'])}<h3>髪色・質感の個別指定</h3>${sel('カラー番号','color',COLORS.map(x=>[x[0],x[0]+' '+x[1]]))}${slider('髪の明るさ','bright',0,10)}${slider('黄色味・暖色感','yellow',0,10)}${sel('根元','roots',['染めたて・根元まで均一','黒い根元1〜2mm','黒い根元5mm','黒い根元1cm','黒い根元2cm','プリン状態3cm以上'])}${sel('ハイライト','highlights',['なし','細いゴールドハイライト','太いゴールドメッシュ','顔周りだけ明るい','毛先だけ明るいグラデーション','自然な色ムラ'])}${sel('毛髪の質感','texture',['健康的で自然な艶','少し乾燥した毛先','ブリーチによるパサつき','ヘアオイルでしっとり','営業後で少し乱れたヘアセット'])}</section>`}

function validateSettings(){
let warnings=[];
const pose=s.outputMode==='scene'?s.action:s.personPose;
if(s.framing!=='全身・靴まで'&&s.shoeNeed==='見せる')warnings.push('靴を見せる指定ですが撮影範囲は「'+s.framing+'」です。全身・靴までを推奨します。');
if(s.outputMode==='scene'){
 const indoor=/ホール|エレベーター|室内|店内|待機室|控室|ソファ|更衣室|自宅|カフェ|美容院|教室|廊下|玄関|車内|後部座席|洗面所|フロア|バックヤード|バー|ラウンジ|食卓|ダイニング|キッチン|ロッカー|ボックス席|サロン|カウンター/.test(s.place);
 const outside=/歩道|路上|街角|外|駐車場|正門|ベランダ|路肩|国分町の繁華街/.test(s.place);
 if(indoor&&!outside&&/歩道から|街角から|屋外から/.test(s.camera))warnings.push('屋内の場所と屋外からの撮影が矛盾しています。撮影位置を屋内へ変更してください。');
}
const jacket=/ロングコート|ダウン|パーカー/.test(O[s.outfit]?.name||'');
if(jacket&&s.tattooNeed==='見える部位を必ず含める')warnings.push('厚手の衣装と刺青の露出指定が衝突する可能性があります。衣装を勝手に変更させないでください。');
if(s.tattoo==='T00'&&s.tattooNeed==='見える部位を必ず含める')warnings.push('刺青なしと、刺青を必ず見せる指定が矛盾しています。');
if(/時刻を確認/.test(pose)&&!/(腕時計|時計|スマホ|携帯電話)/.test(pose))warnings.push('時刻確認の道具が未指定です。腕時計かスマホを明記してください。');
const colorNo=Number(s.color.substring(1));if(colorNo<=3&&Number(s.bright)>=8)warnings.push('暗髪カラーと高い明るさ指定が競合しています。');
return warnings;
}

function buildPrompt(){

const colorLevel=Number(s.color.substring(1));const styling= colorLevel>=12?'日本人が現実のブリーチで得る黄色味と傷みのわずかな不均一さを表現。':'染めた日本人の自然な毛流れと色ムラを表現。';

return `【FACE LOCK｜ABSOLUTE IDENTITY】
Geminiへ別途添付した工藤早紀本人の顔写真を唯一の顔基準とする。40代の日本人女性、身長158cm。顔の輪郭・頬の肉付き・目の形・鼻・口元・毛穴・肌の凹凸・年齢感・顔の左右差をそのまま再現。顔の骨格、実年齢、体型は変更しない。衣装参考画像に写る別の人物の顔を移植しない。目を拡大しない、小顔化しない、若返らせない。

【SCENE｜${person?'PERSON TEST・背景なし':'SCENE TEST・場面あり'}】
${scene}

【HAIR｜STYLE & COLOR LOCK】
髪型 ${h.id}「${h.name}」。髪色 ${c[0]}「${c[1]}」。明るさ ${s.bright}/10。黄色味・暖色感 ${s.yellow}/10。根元：${s.roots}。ハイライト：${s.highlights}。髪の状態：${s.texture}。トップの盛り具合 ${s.topVolume}/5、巻きの強さ ${s.curlLevel}/5、前髪 ${s.bangs}。${styling}髪型に指定がなければトップの盛り、巻きの強さ、前髪の形を勝手に増減しない。

${makeupStyle}ファンデーションの厚さ・カバー力 ${mm[0]}/10、ファンデの白さ ${mm[1]}/10。アイシャドウ ${mm[2]}/10、色「${s.shadowColor}」。黒アイライン ${mm[3]}/10。日本式束感マツエク ${mm[4]}/10、形状は「${s.eyelashShape}」。口紅の濃さ ${mm[5]}/10、色「${s.lipColor}」。チーク ${mm[6]}/10。ファンデの塗布感、目元に重なった化粧品、実在の皮膚の質感を残す。肌色を不自然な白塗りにはせず、別人化しない。

return `<div class="catalogHead"><div><h2>衣装カタログ <span>｜${typeLabel}（全${typeCount}種）</span></h2><p>写真をタップすると衣装とプロンプトが切り替わります</p></div><input aria-label="衣装検索" placeholder="衣装名・番号で検索" value="${esc(studioSearch)}" oninput="studioSearch=this.value;studioPage=1;studioRefreshCenter()"></div>
<div class="typeTabs">${[['suit','♙ スーツ 26'],['dress','♢ ドレス 16'],['casual','♧ 私服 40']].map(x=>`<button class="typeTab ${s.outfitType===x[0]?'active':''}" onclick="studioChangeType('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="subTabs">${studioGroupTabs()}</div><div class="studioGrid">${visible.map(x=>studioTile(x,'outfit',`studioSelect('outfit','${x.id}')`,s.outfit===x.id)).join('')||'<p class="noResults">該当する衣装がありません</p>'}</div>
<div class="pagination"><button onclick="studioPage=Math.max(1,studioPage-1);render()" ${studioPage<=1?'disabled':''}>‹ 前へ</button><span>${studioPage} / ${pages} ページ（${items.length}件）</span><button onclick="studioPage=Math.min(${pages},studioPage+1);render()" ${studioPage>=pages?'disabled':''}>次へ ›</button></div>${studioSelectedPhotoTools('outfit',s.outfit)}<details class="studioDetails"><summary>衣装の丈・素材・フィットを細かく設定</summary><div class="detailInner">${sel('フィット感','fit',['自然なレギュラーフィット','身体に沿う自然なタイトシルエット','かなり細身のフィット感','ゆったりしたシルエット'])}${sel('丈','hem',['衣装の標準丈','マイクロミニ丈','膝上ミニ丈','膝丈','膝下ミディ丈','ふくらはぎ丈','ロング丈','パンツは変更なし'])}${slider('華やかさ','glam',0,5)}${txt('服装の詳細指定','outfitNote',2)}</div></details>`}
function studioSelectedPhotoTools(kind,id){const key=kind+':'+id;return `<div class="selectedTools"><strong>写真の管理｜${esc(id)}</strong><button onclick="zoomCatalogPhoto('${esc(key)}')">⤢ 拡大</button><label class="studioUpload">＋ 写真を登録<input type="file" accept="image/*" onchange="storeCatalogPhoto('${esc(key)}',this.files[0])"></label><button onclick="removeCatalogPhoto('${esc(key)}')">元の写真に戻す</button></div>`}
function studioHair(){let all=Object.values(H);return `<div class="catalogHead"><div><h2>ヘア・髪色<span>｜日本人女性の写真風見本</span></h2><p>髪型と髪色を独立して設定できます</p></div></div><h3 class="sectionMiniTitle">✂ ヘアスタイル（16種類）</h3><div class="studioGrid hairGrid">${all.map(x=>studioTile(x,'hair',`studioSelect('hair','${x.id}')`,s.hair===x.id)).join('')}</div><h3 class="sectionMiniTitle">🎨 髪色（16段階）</h3><div class="colorsGrid">${COLORS.map(x=>`<button class="colorTile ${s.color===x[0]?'chosen':''}" onclick="studioSelect('color','${x[0]}')"><span class="colorSwatch" style="background:linear-gradient(140deg,${x[2]},#1e161b)"></span><b>${x[0]}</b><small>${esc(x[1])}</small></button>`).join('')}</div>${studioSelectedPhotoTools('hair',s.hair)}<details class="studioDetails"><summary>髪のセット・根元・黄色味を調整</summary><div class="detailInner">${slider('トップ盛り','topVolume',0,5)}${slider('巻きの強さ','curlLevel',0,5)}${slider('髪の明るさ','bright',0,10)}${slider('黄色味','yellow',0,10)}${sel('前髪','bangs',['自然な前髪','薄い前髪','厚めの前髪','斜め流し','かき上げ','前髪なし'])}${sel('根元','roots',['染めたて・根元まで均一','黒い根元1〜2mm','黒い根元5mm','黒い根元1cm','黒い根元2cm','プリン状態3cm以上'])}${sel('毛髪の質感','texture',['健康的で自然な艶','少し乾燥した毛先','ブリーチによるパサつき','ヘアオイルでしっとり','営業後で少し乱れたヘアセット'])}</div></details>`}
function studioMakeup(){return `<div class="catalogHead"><div><h2>メイク見本 <span>｜8種類</span></h2><p>日本人キャバ嬢のメイクを段階的に設定</p></div></div><div class="studioGrid makeupGrid">${makeupPresets.map((m,i)=>studioTile({id:m[0],name:m[1]},'makeup',`studioMakeupApply(${i})`,s.makeup===m[0])).join('')}</div><div class="levelLine"><span>メイク濃度</span><input type="range" min="0" max="10" value="${s.m[0]}" oninput="studioMakeupLevel(this.value)"><b id="studioLevelNum">${s.m[0]}/10</b></div>${studioSelectedPhotoTools('makeup',s.makeup)}<div class="makeupSliders">${['ファンデ・カバー力','ファンデの白さ','アイシャドウ','アイライン','マツエク','口紅','チーク'].map((x,i)=>mSlider(x,i)).join('')}</div><details class="studioDetails"><summary>マツエク形状・カラーの詳細設定</summary><div class="detailInner">${sel('アイシャドウ色','shadowColor',['ブラウン','ブルーグレー','ブルー・ラベンダー','ローズブラウン','ブラック・スモーキー','ゴールドラメ','ボルドー','ピンクパープル'])}${sel('マツエク形状','eyelashShape',['目尻がやや長い束感','均一な長さの束感','上向きスパイク束','中央が長いドール型','目尻扇状ロング'])}${sel('リップの色','lipColor',['ピンクベージュ','ローズピンク','濃いローズレッド','鮮やかな赤','ワインレッド','ブラウンレッド'])}</div></details>`}
function studioMakeupApply(i){applyMakeup(i);render()}
function studioMakeupLevel(v){let n=Number(v);s.m=[n,Math.max(0,n-1),n,n,n,Math.max(0,n-1),Math.max(0,n-3)];s.makeup='CUSTOM';save();const b=document.getElementById('studioLevelNum');if(b)b.textContent=n+'/10';studioUpdatePromptBox()}
function studioScenes(){const g=SCENES.find(x=>x.id===s.group)||SCENES[0],search=s.filter.trim().toLowerCase(),items=search?SCENES.flatMap(x=>x.items).filter(x=>(x.name+' '+x.place+' '+x.action).toLowerCase().includes(search)):g.items;return `<div class="catalogHead"><div><h2>場面・シチュエーション <span>｜252場面</span></h2><p>21カテゴリーから選択、場所・心理・構図は自由入力可能</p></div></div><div class="sceneGroups">${SCENES.map(x=>`<button class="sceneGroup ${s.group===x.id?'on':''}" onclick="studioGroupScene('${x.id}')">${x.icon} ${esc(x.label)}</button>`).join('')}</div><div class="sceneFind"><input type="search" placeholder="全252場面を検索" value="${esc(s.filter)}" oninput="studioFilterScene(this.value)"></div><div class="sceneList" id="studioSceneList">${items.map(x=>`<button class="sceneRow ${x.id===s.scene?'on':''}" onclick="studioScene('${x.id}')"><span>📍</span><div><strong>${esc(x.name)}</strong><small>${esc(x.place)}</small></div></button>`).join('')||'<p>場面が見つかりません</p>'}</div><details class="studioDetails" open><summary>場所・関係性・心理・アングルを自由入力</summary><div class="detailInner">${studioSceneFields()}</div></details>`}
function studioSceneFields(){return `${txt('場所・背景','place',2)}${txt('仕草・動作','action',2)}${txt('撮影者の位置・人物構図','camera',2)}${sel('相手との関係','relation',['指定なし','初対面','顔見知り','常連客','仕事上の関係','親密な関係','秘密の交際','不倫関係','夫婦','友人','同僚','関係を解消する途中'])}${txt('相手・関係の自由入力','relationPerson',2)}${sel('心理・雰囲気','innerMood',['自然な落ち着き','少し戸惑う','緊張を隠す','迷いがある','親しみを感じる','冷めた目つき','疲れと不安','後悔がある','慣れた振る舞い','はっきり断る','自信がある'])}${txt('時刻・天候','sceneTime',1)}${txt('シーンの自由指定','sceneNotes',2)}`}
function studioGroupScene(id){s.group=id;s.filter='';save();render()}
function studioFilterScene(q){s.filter=q;save();const el=document.getElementById('studioSceneList');if(el){const items=SCENES.flatMap(x=>x.items).filter(x=>(x.name+' '+x.place+' '+x.action).toLowerCase().includes(q.toLowerCase()));el.innerHTML=items.slice(0,100).map(x=>`<button class="sceneRow ${x.id===s.scene?'on':''}" onclick="studioScene('${x.id}')"><span>📍</span><div><strong>${esc(x.name)}</strong><small>${esc(x.place)}</small></div></button>`).join('')||'<p>場面が見つかりません</p>'}}
function studioDetailed(){return `<div class="catalogHead"><div><h2>詳細設定<span>｜構図・背景・人物検証</span></h2></div></div><details class="studioDetails" open><summary>📷 カメラと構図</summary><div class="detailInner">${sel('撮影範囲','framing',['顔アップ','バストアップ','上半身','膝上','全身・靴まで'])}${sel('向き','angle',['真正面','左斜め45度','右斜め45度','左真横','右真横','背面から振り向く'])}${sel('視線','gaze',['カメラ目線なし、自然に横を見る','伏し目','真正面を見るがカメラ目線ではない','正面からカメラ目線','斜め下を見る'])}${sel('照明','lighting',['柔らかい室内の実在光','昼の自然な窓光','均一な白色LED光','弱い暖色照明'])}${sel('表情','expression',['自然な表情・カメラ目線なし','少しぎこちない表情','戸惑いの残る表情','控えめな微笑み','冷めた落ち着いた目つき','気だるく伏し目','疲れを隠した表情','自信のある大人の表情','真剣な表情・笑顔なし'])}</div></details><details class="studioDetails" open><summary>👤 背景なし・人物の動作</summary><div class="detailInner">${sel('背景','bg',['淡いグレーの無地壁','白い無地壁','暗い無地壁','背景を極力排除した中立的な無地背景'])}${txt('ポーズ','personPose',2)}${txt('追加演出','extra',2)}<button class="studioPrimary" onclick="studioPromptMode('person');studioTab('result')">背景なしプロンプトを作る</button></div></details><details class="studioDetails"><summary>💾 設定の保存・読込</summary><div class="detailInner">${studioBackupControls()}</div></details>`}
function studioAcc(){return `<div class="catalogHead"><div><h2>刺青・アクセサリー・靴・ネイル</h2><p>刺青の工程や仕上がりも設定に反映</p></div></div>${panelAcc()}`}
function studioBackupControls(){return `<div class="backupControls"><button onclick="downloadSettings()">JSON書き出し</button><label>JSONを読み込む<input type="file" accept="application/json" onchange="importSettings(this.files[0])"></label><button onclick="resetAll()">設定初期化</button></div>`}
function studioAuto(){return `<div class="catalogHead"><h2>⚡ 12段階のオートプリセット</h2></div>${panelAuto()}`}
function studioResultPanel(){return `<div class="catalogHead"><h2>生成プロンプトの確認とコピー</h2></div><p class="hint">右のプロンプト欄から全文をコピーできます。本人の参照写真はGeminiに別途添付してください。</p><div class="resultExtras">${imageUploads()}<section class="section"><h2>設定の保存と読み込み</h2>${studioBackupControls()}</section></div>`}
function studioCenter(){return s.tab==='outfit'?studioOutfits():s.tab==='hair'?studioHair():s.tab==='makeup'?studioMakeup():s.tab==='scene'?studioScenes():s.tab==='acc'?studioAcc():s.tab==='detail'||s.tab==='person'?studioDetailed():s.tab==='auto'?studioAuto():studioResultPanel()}
function studioSideScenes(){const scenes=[['floor-0','店内フロア（接客中）','🥂'],['back-1','待機室（タバコ・スマホ）','🛋'],['dohan-0','同伴・食事','🍽'],['night-0','アフター（深夜）','🌃'],['home-0','自宅帰宅','🏠'],['salon-4','美容院','✂']];return `<section class="studioPanel rightScenes"><h3>📍 場面・シチュエーション</h3>${scenes.map(([id,name,icon])=>{const scene=SCENES.flatMap(x=>x.items).find(x=>x.id===id);return scene?`<button class="quickScene ${s.scene===id?'active':''}" onclick="studioScene('${id}')"><span class="quickIcon">${icon}</span><span>${esc(name)}</span></button>`:''}).join('')}<button class="moreScenes" onclick="studioTab('scene')">252場面から探す ＋</button></section>`}
function studioPromptPanel(isFull=false){let prompt=buildPrompt();return `<section class="studioPanel promptPanel"><div class="promptHead"><h3>▣ 生成プロンプト <span>Gemini用</span></h3><div class="promptMode"><button class="${s.outputMode==='scene'?'on':''}" onclick="studioPromptMode('scene')">場面あり</button><button class="${s.outputMode==='person'?'on':''}" onclick="studioPromptMode('person')">背景なし</button></div></div><div class="promptPre ${isFull||studioPromptExpanded?'expanded':''}" id="studioPromptText">${esc(prompt)}</div><div class="promptButtons"><button onclick="copyPrompt()">▣ 全文コピー</button><button onclick="studioPromptExpand()">${studioPromptExpanded?'縮小':'全文表示'}</button></div></section>`}
function studioSidebar(){return `<div class="sideContent">${studioSideScenes()}<button class="generateBtn" onclick="studioGenerate()">⚡ プロンプトを生成</button>${studioPromptPanel()}<div class="asideFoot">✓ 設定は端末内に保存<br>✓ AI生成の写真風見本<br>✓ 本人顔は別途Geminiに添付</div></div>`}
function studioRefreshCenter(){document.getElementById('studioCatalog').innerHTML=studioCenter();}
function studioUpdatePromptBox(){const p=document.getElementById('studioPromptText');if(p)p.textContent=buildPrompt()}
function render(){try{document.getElementById('studioTopNav').innerHTML=studioHeaderTabs();document.getElementById('studioBottomNav').innerHTML=studioBottom();document.getElementById('studioPreview').innerHTML=studioPreview();document.getElementById('studioCatalog').innerHTML=studioCenter();document.getElementById('studioSide').innerHTML=studioSidebar();document.getElementById('studioLayout').classList.toggle('focusResult',s.tab==='result');save()}catch(e){console.error('studio render error',e);document.getElementById('studioCatalog').innerHTML='<div class="studioPanel"><h2>表示を回復できませんでした</h2><p>Safariで再読み込みしてください。</p></div>'}}

// Initialize saved state; no background uploads or remote API calls.
render();
</script>
<style>
.photo-actions{display:flex;gap:2px;padding:5px;background:#221b23}.photo-actions button{flex:1;border:1px solid #67525f;background:#3b303b;color:#f4dbe5;border-radius:8px;font-size:11px;padding:8px 2px}
#photoLightbox{position:fixed;inset:0;z-index:999;background:#09080bec;display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px;gap:15px}
#photoLightbox.open{display:flex}#photoLightbox img{max-width:96vw;max-height:78vh;object-fit:contain;border-radius:12px}#photoLightbox button{background:#f0c990;color:#271d25;border:0;border-radius:12px;padding:12px 30px;font-weight:800}
</style>
<div id="photoLightbox" role="dialog" aria-label="参考写真の拡大表示"><img id="zoomPhoto" alt="参考写真の拡大"><button type="button" onclick="document.getElementById('photoLightbox').classList.remove('open')">閉じる ✕</button></div>
<script>
window.zoomCatalogPhoto=(key)=>{const sample=sampleImage[key];const url=photoCache[key]||(sample&&sample.url);if(!url){toast('写真未登録です。下のボタンから写真を追加してください');return}document.getElementById('zoomPhoto').src=url;document.getElementById('photoLightbox').classList.add('open')};
window.removeCatalogPhoto=(key)=>{delete photoCache[key];if(photoDB){const tx=photoDB.transaction('photos','readwrite');tx.objectStore('photos').delete(key)}render();toast('内蔵写真に戻しました')};
</script>
</body></html>
