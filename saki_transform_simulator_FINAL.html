function validateSettings(){
let warnings=[];
const pose=s.outputMode==='scene'?s.action:s.personPose;
if(s.framing!=='全身・靴まで'&&s.shoeNeed==='見せる')warnings.push('靴を見せる指定ですが撮影範囲は「'+s.framing+'」です。全身・靴までを推奨します。');
if(s.outputMode==='scene'){
 const indoor=/ホール|エレベーター|室内|店内|待機室|控室|ソファ|更衣室|自宅|カフェ|美容院|教室|廊下|玄関|車内|後部座席|洗面所|フロア|バックヤード|バー|ラウンジ|食卓|ダイニング|キッチン|ロッカー|ボックス席|サロン|カウンター/.test(s.place);
 const outside=/歩道|路上|街角|外|駐車場|正門|ベランダ|路肩|国分町の繁華街/.test(s.place);
 if(indoor&&!outside&&/歩道から|街角から|屋外から/.test(s.camera))warnings.push('屋内の場所と屋外からの撮影が矛盾しています。撮影位置を屋内へ変更してください。');
}
const jacket=/ロングコート|ダウン|パーカー/.test(O[s.outfit]?.name||'');
if(jacket&&s.tattooNeed==='見える部位を必ず含める')warnings.push('厚手の衣装と刺青の露出指定が衝突する可能性があります。衣装を勝手に変更させないでください。');
if(s.tattoo==='T00'&&s.tattooNeed==='見える部位を必ず含める')warnings.push('刺青なしと、刺青を必ず見せる指定が矛盾しています。');
if(/時刻を確認/.test(pose)&&!/(腕時計|時計|スマホ|携帯電話)/.test(pose))warnings.push('時刻確認の道具が未指定です。腕時計かスマホを明記してください。');
const colorNo=Number(s.color.substring(1));if(colorNo<=3&&Number(s.bright)>=8)warnings.push('暗髪カラーと高い明るさ指定が競合しています。');
return warnings;
}

function buildPrompt(){
const o=O[s.outfit]||O.P01,h=H[s.hair]||H.H01,c=COLORS.find(x=>x[0]===s.color)||COLORS[12];

const colorLevel=Number(s.color.substring(1));const styling= colorLevel>=12?'日本人が現実のブリーチで得る黄色味と傷みのわずかな不均一さを表現。':'染めた日本人の自然な毛流れと色ムラを表現。';
const makeupStyle=mm[0]<=3&&mm[2]<=3?'40代日本人女性の自然な現代メイク。':'現代の日本人女性が施す実在感のある夜職系の濃いメイク。';
const tattooCondition=s.tattooNeed==='見える部位を必ず含める'?'刺青が存在する箇所を構図に含める。ただし衣装を勝手に脱がせたり形を変えたりしない。':'刺青が衣装に隠れている場合は無理に見せない。';
return `【FACE LOCK｜ABSOLUTE IDENTITY】
Geminiへ別途添付した工藤早紀本人の顔写真を唯一の顔基準とする。40代の日本人女性、身長158cm。顔の輪郭・頬の肉付き・目の形・鼻・口元・毛穴・肌の凹凸・年齢感・顔の左右差をそのまま再現。顔の骨格、実年齢、体型は変更しない。衣装参考画像に写る別の人物の顔を移植しない。目を拡大しない、小顔化しない、若返らせない。

【SCENE｜${person?'PERSON TEST・背景なし':'SCENE TEST・場面あり'}】
${scene}

【HAIR｜STYLE & COLOR LOCK】
髪型 ${h.id}「${h.name}」。髪色 ${c[0]}「${c[1]}」。明るさ ${s.bright}/10。黄色味・暖色感 ${s.yellow}/10。根元：${s.roots}。ハイライト：${s.highlights}。髪の状態：${s.texture}。トップの盛り具合 ${s.topVolume}/5、巻きの強さ ${s.curlLevel}/5、前髪 ${s.bangs}。${styling}髪型に指定がなければトップの盛り、巻きの強さ、前髪の形を勝手に増減しない。

【MAKEUP｜NUMERIC LOCK】
${makeupStyle}ファンデーションの厚さ・カバー力 ${mm[0]}/10、ファンデの白さ ${mm[1]}/10。アイシャドウ ${mm[2]}/10、色「${s.shadowColor}」。黒アイライン ${mm[3]}/10。日本式束感マツエク ${mm[4]}/10、形状は「${s.eyelashShape}」。口紅の濃さ ${mm[5]}/10、色「${s.lipColor}」。チーク ${mm[6]}/10。ファンデの塗布感、目元に重なった化粧品、実在の皮膚の質感を残す。肌色を不自然な白塗りにはせず、別人化しない。

}

window.fixWarnings=()=>{if(s.framing!=='全身・靴まで'&&s.shoeNeed==='見せる')s.shoeNeed='指定はするが画面外でよい';if(s.outputMode==='scene'&&/ホール|エレベーター|室内|店内|待機室|控室|ソファ|自宅|美容院|カフェ|更衣室|車内|洗面所/.test(s.place)&&/歩道から|街角から|屋外から/.test(s.camera))s.camera='現場内の撮影者、2m先からiPhoneスナップ';if(s.tattoo==='T00')s.tattooNeed='衣装から自然に見える範囲のみ';if(/ロングコート|ダウン|パーカー/.test(O[s.outfit]?.name||''))s.tattooNeed='衣装から自然に見える範囲のみ';if(Number(s.color.substring(1))<=3&&Number(s.bright)>=8)s.bright=4;save();render();toast('矛盾を補正しました')};
window.downloadPrompt=()=>{const blob=new Blob([buildPrompt()],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='saki_precise_prompt_'+(s.outputMode==='person'?'person':'scene')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};

window.change=(key,value)=>{field(key,value);if(['color'].includes(key))render()};window.updateRange=(key,val)=>{field(key,Number(val));const el=$('#nv-'+key);if(el)el.textContent=val};window.updateM=(i,val)=>{s.m[i]=Number(val);s.makeup='CUSTOM';save();$('#mv-'+i).textContent=val};window.field=field;window.setMode=setMode;window.setTab=setTab;window.stageApply=stageApply;window.pick=pick;window.changeOutType=t=>{s.outfitType=t;s.outfitGroup=t==='casual'?'day':t==='suit'?'black':'plain';save();render()};window.groupOut=g=>{s.outfitGroup=g;save();render()};window.setHairView=v=>{s.hairView=v;save();render()};window.applyMakeup=i=>{let m=makeupPresets[i];s.makeup=m[0];s.m=[...m[2]];if(i===4)s.shadowColor='ブルー・ラベンダー';if(i===5)s.shadowColor='ローズブラウン';if(i===3)s.shadowColor='ブルーグレー';save();render()};window.setAccView=v=>{s.accView=v;save();render()};window.chooseGroup=g=>{s.group=g;s.filter='';save();render()};window.chooseScene=id=>{setScene(id);save();render()};window.filterScenes=v=>{s.filter=v;save();let old=document.activeElement.selectionStart;let container=$('#sceneItems');const q=v.trim().toLowerCase();const rr=q?SCENES.flatMap(x=>x.items).filter(x=>(x.name+' '+x.place+' '+x.action).toLowerCase().includes(q)):SCENES.find(x=>x.id===s.group)?.items||[];container.innerHTML=rr.map(x=>`<button class="sceneitem ${s.scene===x.id?'active':''}" onclick="chooseScene('${x.id}')"><strong>${esc(x.name)} ${s.scene===x.id?'✓':''}</strong><small>${esc(x.place)}</small><small>${esc(x.action)}</small></button>`).join('')||'<p class="muted">見つかりませんでした。</p>';let n=container.previousElementSibling;if(n)n.textContent=rr.length+' シーン表示'};window.setCamera=x=>{s.camera=x+'。iPhoneの自然な縦9:16スナップ';save();render()};window.setStyle=x=>{s.style=x;save();render()};window.togglePrompt=()=>{s.showPrompt=!s.showPrompt;save();$('#promptText').classList.toggle('hidden',!s.showPrompt)};
async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.focus();el.select();document.execCommand('copy');el.remove()}toast('コピーしました ✓')}
window.copyPrompt=()=>copyText(buildPrompt());window.copySummary=()=>copyText('早紀・変貌シミュレーター 設定\n'+STAGES.find(x=>x.id===s.stage)?.name+'\n'+H[s.hair]?.name+' / '+COLORS.find(x=>x[0]===s.color)?.[1]+'\n'+O[s.outfit]?.id+' '+O[s.outfit]?.name+'\nメイク '+s.m.join('/')+'\n刺青 '+ADDONS.tattoo.find(x=>x[0]===s.tattoo)?.[1]+'\n場所 '+s.place+'\n仕草 '+s.action);
window.loadRef=(type,file)=>{if(!file)return;if(file.size>12*1024*1024){toast('画像は12MB以下にしてください');return}const reader=new FileReader();reader.onload=()=>{referenceImages[type]=reader.result;const d=$('#ref-'+type);if(d)d.innerHTML=`<img class="refphoto" src="${reader.result}">`;toast('端末内で参考画像を表示しました')};reader.readAsDataURL(file)};
window.downloadSettings=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='saki_simulator_settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
window.importSettings=file=>{if(!file)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(v&&typeof v==='object'&&v.outfit&&v.color){s={...DEFAULT,...v};render();toast('設定を読み込みました')}else throw Error('bad')}catch(e){toast('設定ファイルの読み込みに失敗しました')}};r.readAsText(file)};
window.resetAll=()=>{if(!confirm('すべての選択設定を初期状態に戻しますか？'))return;s={...DEFAULT};save();render()};
function toast(x){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;z-index:60;bottom:95px;left:50%;transform:translateX(-50%);background:#ffe0a9;color:#2c1b24;padding:10px 16px;border-radius:40px;font-size:13px;font-weight:bold;box-shadow:0 5px 28px #0009;white-space:nowrap';document.body.appendChild(e)}e.textContent=x;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.remove(),2200)}
$('#btnAuto').addEventListener('click',()=>setMode('auto'));$('#btnManual').addEventListener('click',()=>setMode('manual'));
// Initialize saved state; no background uploads or remote API calls.
render();
</script></body></html>
