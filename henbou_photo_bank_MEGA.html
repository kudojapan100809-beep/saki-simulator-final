const $=s=>document.getElementById(s);function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('保存容量に達しました。');return false}}let custom=load('henbouCustom',[]),favs=new Set(load('henbouFavs',[])),selected=new Set(load('henbouSelected',[])),tab='メイク',onlyFav=false,onlySel=false;const all=()=>base.concat(custom);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let timer;function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2600)}function openModal(html){$('dialog').innerHTML='<button class="close" id="close">閉じる</button>'+html;$('modal').hidden=false;$('close').onclick=()=>{$('modal').hidden=true}}$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').hidden=true};function renderTabs(){$('tabs').innerHTML=cats.map(c=>`<button class="${tab===c?'active':''}" data-cat="${c}">${c} <small>${all().filter(x=>x.cat===c&&!x.color).length}</small></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.cat;onlySel=false;$('brand').value='';$('search').value='';render()})}function setSelected(){save('henbouSelected',[...selected]);$('selectedCount').textContent=selected.size+'枚選択'}function render(){renderTabs();const group=all().filter(x=>onlySel?selected.has(x.id):x.cat===tab),previous=$('brand').value;const brands=[...new Set(group.map(x=>x.brand))];$('brand').innerHTML='<option value="">全ブランド</option>'+brands.map(b=>`<option>${esc(b)}</option>`).join('');if(brands.includes(previous))$('brand').value=previous;const q=$('search').value.trim().toLowerCase();let rows=group.filter(x=>(!onlyFav||favs.has(x.id))&&(!$('brand').value||x.brand===$('brand').value)&&(!q||[x.name,x.brand,x.desc].join(' ').toLowerCase().includes(q)));$('fav').textContent=onlyFav?'★ お気に入り':'☆ お気に入り';$('sel').textContent=onlySel?'全カテゴリ選択中':'選択済み';$('count').textContent=rows.length+'件';$('links').innerHTML=onlySel?'':`<details class="catalog"><summary>公式ギャラリー・画像検索（${mega[tab].length}分類）</summary><div class="links">${presets[tab].map(([n,u])=>`<a target="_blank" rel="noopener" href="${esc(u.startsWith('?')?'https://www.google.com/search?tbm=isch&q='+encodeURIComponent(u.slice(1)):u)}">${esc(n)} ↗</a>`).join('')}</div><div class="links">${mega[tab].filter(([n,t])=>!q||[n,t].join(' ').toLowerCase().includes(q)).map(([n,q])=>`<a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(q)}">${esc(n)} ↗</a>`).join('')}</div></details><div class="sectiontitle">参考写真・色見本</div>`;$('grid').innerHTML=rows.map(x=>`<article class="card ${selected.has(x.id)?'selected':''}"><div class="picture" data-view="${x.id}">${x.color?`<div class="swatch" style="--c:${x.color}">${esc(x.name)}</div>`:`<img loading="lazy" src="${esc(x.img)}" alt="${esc(x.name)}" onerror="this.hidden=true;this.parentNode.querySelector('.missing').hidden=false"><span class="missing" hidden>画像を表示できません。<br>出典ページから確認</span>`}<button class="star" data-fav="${x.id}" aria-label="お気に入り">${favs.has(x.id)?'★':'☆'}</button></div><div class="cardinfo"><div class="brand">${esc(x.brand)}</div><div class="name">${esc(x.name)}</div><div class="desc">${esc(x.desc)}</div><div class="actions"><button class="primary" data-copy="${x.id}">${x.color?'色指定コピー':'画像コピー'}</button><button data-select="${x.id}">${selected.has(x.id)?'✓ 選択':'＋ 選択'}</button></div>${x.url?`<a class="source" href="${esc(x.url)}" target="_blank" rel="noopener">出典ページ ↗</a>`:''}${x.local?`<button class="source" data-delete="${x.id}">削除</button>`:''}</div></article>`).join('')||'<div class="empty">該当する画像はありません</div>';setSelected()}
function get(id){return all().find(x=>x.id===id)}function directive(x){return '【'+x.cat+'】'+x.name+'（'+x.brand+'）\n'+x.desc+'\n'+(['接客シーン','キャスト写真','店内・HP'].includes(x.cat)?'構図・仕草・照明・背景のみ参考にし、実在人物の顔は再現しない。':x.cat==='メイク'?'メイクのみ参照し、顔立ちは変更しない。':x.cat==='髪色'?'髪色のみ参照し、髪型と顔は別指定を維持。':x.cat==='ヘアセット'?'髪型とセットのみ参照し、顔と髪色は別指定を維持。':'衣装のみ参照し、モデルの顔・髪・体型は反映しない。')}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch{openModal('<h3>テキストをコピー</h3><textarea id="txt" readonly></textarea><p>長押ししてコピーしてください。</p>');$('txt').value=t;$('txt').select()}}
function imageBlob(x){return fetch(x.img).then(r=>{if(!r.ok)throw Error();return r.blob()}).then(b=>new Promise((resolve,reject)=>{const u=URL.createObjectURL(b),im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);URL.revokeObjectURL(u);c.toBlob(v=>v?resolve(v):reject(Error()),'image/png')};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error())};im.src=u}))}
async function copyImage(x){if(x.color)return copyText(directive(x));try{if(!navigator.clipboard?.write||!window.ClipboardItem)throw Error();await navigator.clipboard.write([new ClipboardItem({'image/png':imageBlob(x)})]);toast('画像をコピーしました')}catch{view(x,true)}}
function view(x,fail=false){if(x.color){copyText(directive(x));return}openModal(`<h3>${esc(x.name)}</h3><p>${fail?'直接コピーできませんでした。画像を長押しして「コピー」または「写真に保存」を選択してください。':'画像を長押しするとコピー・保存できる場合があります。'}</p><img src="${esc(x.img)}" alt="${esc(x.name)}"><div class="row"><button id="copyD">指定文コピー</button><button id="copyU">画像URLコピー</button><a class="source" href="${esc(x.img)}" target="_blank" rel="noopener">画像を別タブで開く ↗</a>${x.url?`<a class="source" href="${esc(x.url)}" target="_blank" rel="noopener">出典 ↗</a>`:''}</div>`);$('copyD').onclick=()=>copyText(directive(x));$('copyU').onclick=()=>copyText(x.img)}
$('grid').onclick=e=>{const b=e.target.closest('button');if(b){let id=b.dataset.copy||b.dataset.select||b.dataset.fav||b.dataset.delete;let x=get(id);if(!x)return;if(b.dataset.copy)copyImage(x);if(b.dataset.select){selected.has(id)?selected.delete(id):selected.add(id);render()}if(b.dataset.fav){favs.has(id)?favs.delete(id):favs.add(id);save('henbouFavs',[...favs]);render()}if(b.dataset.delete&&confirm('この追加画像を削除しますか？')){custom=custom.filter(a=>a.id!==id);selected.delete(id);favs.delete(id);removePhoto(id);save('henbouFavs',[...favs]);render()}return}const v=e.target.closest('[data-view]');if(v){const x=get(v.dataset.view);if(e.target.closest('.missing')&&x.url)window.open(x.url,'_blank','noopener');else view(x)}};$('search').oninput=render;$('brand').onchange=render;$('fav').onclick=()=>{onlyFav=!onlyFav;render()};$('sel').onclick=()=>{onlySel=!onlySel;render()};$('clear').onclick=()=>{selected.clear();render()};$('bundle').onclick=()=>{const xs=all().filter(x=>selected.has(x.id));if(!xs.length)return toast('画像・色見本を選択してください');copyText('【小説変貌｜参考画像の適用範囲】\n顔は本人参照画像で固定。以下は指定部位のみの参考。\n\n'+xs.map(directive).join('\n\n'))};
let dbPromise=new Promise((resolve,reject)=>{try{const req=indexedDB.open('henbouPhotoBankMega',1);req.onupgradeneeded=()=>req.result.createObjectStore('photos',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)}catch(e){reject(e)}});dbPromise.catch(()=>{});
async function dbOp(mode,fn){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('photos',mode),store=tx.objectStore('photos');let req=fn(store);tx.oncomplete=()=>resolve(req?.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function putPhotos(xs){await dbOp('readwrite',store=>{xs.forEach(x=>store.put(x))});}
async function removePhoto(id){try{await dbOp('readwrite',store=>store.delete(id))}catch{}save('henbouCustom',load('henbouCustom',[]).filter(x=>x.id!==id))}
function importModal(){openModal('<h3>写真を一括登録</h3><p>写真ライブラリから複数枚選択、または画像の直接URLを1行に1件貼り付け。端末のブラウザ内に保存します。</p><label>写真（複数選択可）<input id="file" type="file" accept="image/*" multiple></label><label>画像URL（任意・改行区切り）<textarea id="urls" placeholder="https://…"></textarea></label><label>カテゴリ<select id="newcat">'+cats.map(c=>`<option ${c===tab?'selected':''}>${c}</option>`).join('')+'</select></label><label>名前（任意・連番付き）<input id="newname" placeholder="例：金髪ストレート"></label><label>ブランド・出典（任意）<input id="newbrand"></label><label>参考にする特徴（任意）<input id="newdesc"></label><button class="primary" id="savePhoto">まとめて登録</button><p id="progress"></p>');$('savePhoto').onclick=async()=>{const fs=[...$('file').files],urls=$('urls').value.split(/\r?\n/).map(u=>u.trim()).filter(u=>/^https?:\/\//i.test(u)),name=$('newname').value.trim(),cat=$('newcat').value,brand=$('newbrand').value||'MY PHOTO',desc=$('newdesc').value; if(!fs.length&&!urls.length)return toast('写真または画像URLを指定してください');$('savePhoto').disabled=true;let xs=[],total=fs.length+urls.length,failed=0;for(let i=0;i<total;i++){try{let img=i<fs.length?await compress(fs[i]):urls[i-fs.length];xs.push({id:'u'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,8),name:(name|| (i<fs.length?fs[i].name.replace(/\.[^.]+$/,''):'参考画像'))+(total>1?' '+(i+1):''),cat,brand,desc,img,local:true});}catch{failed++}$('progress').textContent=(i+1)+' / '+total+' 処理済み'}try{await putPhotos(xs);custom=custom.concat(xs);tab=cat;onlyFav=false;onlySel=false;$('search').value='';$('brand').value='';$('modal').hidden=true;render();toast(xs.length+'枚登録しました'+(failed?'（'+failed+'枚失敗）':''))}catch{if(save('henbouCustom',load('henbouCustom',[]).concat(xs))){custom=custom.concat(xs);tab=cat;$('modal').hidden=true;render();toast(xs.length+'枚登録しました')}else{$('progress').textContent='保存できませんでした。枚数を減らして再試行してください。';$('savePhoto').disabled=false}}}}
function compress(f){return new Promise((resolve,reject)=>{let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.85))};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error())};im.src=u})}
const collectCode="javascript:(()=>{const a=[...document.images].filter(i=>i.naturalWidth>=200&&i.naturalHeight>=200).map(i=>i.currentSrc||i.src).filter(u=>/^https?:/.test(u));const t=document.createElement('textarea');t.value=[...new Set(a)].join('\\n');Object.assign(t.style,{position:'fixed',top:'10%',left:'5%',width:'90%',height:'75%',zIndex:2147483647,background:'white',color:'black',fontSize:'16px'});document.body.appendChild(t);t.focus();t.select();})()";
$('collect').onclick=()=>{openModal('<h3>出典ページから一括登録</h3><p>一番簡単なのは、公式ギャラリーを開き、必要な写真を端末に保存し、PHOTO BANKの「写真一括追加」でまとめて選択する方法です。</p><p>上級者向け：下のコードをSafariのブックマークのアドレス欄に登録し、出典ページ上でそのブックマークを実行すると、表示済みの写真URLをテキスト欄にまとめます。コピーして「写真一括追加」のURL欄に貼り付けてください。サイトによっては動作しません。公開写真だけを利用し、出典・利用条件を確認してください。</p><textarea id="collectText" readonly></textarea><button id="collectCopy">収集コードをコピー</button>');$('collectText').value=collectCode;$('collectCopy').onclick=()=>copyText(collectCode)};
$('add').onclick=importModal;render();dbOp('readonly',store=>store.getAll()).then(xs=>{const ids=new Set(custom.map(x=>x.id));custom=custom.concat(xs.filter(x=>!ids.has(x.id)));render()}).catch(()=>{});
</script></body></html>
